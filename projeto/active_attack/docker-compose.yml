# Ambiente isolado para a Abordagem D (RQ4): aplicações PROPOSITALMENTE VULNERÁVEIS,
# executadas em uma rede Docker interna (sem rota para a internet). NÃO adicione serviços
# que não sejam, eles próprios, aplicações vulneráveis conhecidas e locais.
#
# Antes de rodar: execute `bash setup_targets.sh` uma vez para clonar NodeGoat, PyGoat e
# VAmPI em _vendor/ — eles são buildados a partir do Dockerfile oficial de cada projeto,
# não de uma imagem pronta do Docker Hub (ver nota em setup_targets.sh sobre por que:
# resumindo, não há imagem oficial confirmada para esses três no Docker Hub — confiar em
# um namespace de terceiro adivinhado seria arriscado e pode nem corresponder ao projeto
# certo). O Juice Shop é exceção: tem imagem oficial publicada pelo próprio mantenedor.
#
# Uso:
#   bash setup_targets.sh
#   docker compose up -d --build
#   docker compose ps        # confirme que os serviços estão healthy antes de rodar o agente
#   docker compose down -v   # ao final da coleta
#
# IMPORTANTE: "internal: true" na rede remove a rota padrão para a internet dos
# containers — eles só se comunicam entre si e com o host via as portas publicadas
# abaixo. Isso é intencional: impede que qualquer um desses apps (ou um agente operando
# contra eles) alcance outra coisa na rede.

networks:
  vulnerable_net:
    internal: true

services:
  # Imagem oficial, publicada pelo mantenedor do projeto — ver
  # https://help.owasp-juice.shop/part1/running.html (confirmado: `docker run -d -p
  # 3000:3000 bkimminich/juice-shop`, porta padrão 3000).
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: active_attack_juice_shop
    ports:
      - "3000:3000"
    networks:
      - vulnerable_net
    restart: unless-stopped

  # PyGoat: buildado a partir do fonte clonado por setup_targets.sh (não há imagem oficial
  # confirmada no Docker Hub). Confirme a porta exposta no Dockerfile/README do projeto
  # antes da primeira execução — 8000 é o valor usual documentado pelo OWASP DevGuide,
  # mas pode variar por versão.
  pygoat:
    build:
      context: ./_vendor/pygoat
    container_name: active_attack_pygoat
    ports:
      - "8000:8000"
    networks:
      - vulnerable_net
    restart: unless-stopped

  # VAmPI: idem, buildado do fonte clonado. O projeto tem sua própria variável de ambiente
  # para alternar entre modo vulnerável/corrigido — confirme o nome exato (geralmente
  # algo como "vulnerable=true" em minúsculas) no Dockerfile/docker-compose.yml do
  # próprio repositório antes de rodar, e ajuste a linha "environment" abaixo.
  vampi:
    build:
      context: ./_vendor/vampi
    container_name: active_attack_vampi
    environment:
      - vulnerable=true   # CONFIRME o nome/valor exato no repo clonado antes da coleta
    ports:
      - "5000:5000"
    networks:
      - vulnerable_net
    restart: unless-stopped

  # NodeGoat: SEM imagem oficial no Docker Hub — o próprio projeto recomenda
  # `docker-compose build && docker-compose up` a partir do repositório clonado
  # (confirmado em https://github.com/OWASP/NodeGoat, porta padrão 4000). Por isso
  # buildamos a partir do _vendor/nodegoat clonado, reusando o Dockerfile deles.
  nodegoat-db:
    image: mongo:6
    container_name: active_attack_nodegoat_db
    networks:
      - vulnerable_net
    restart: unless-stopped

  nodegoat:
    build:
      context: ./_vendor/nodegoat
    container_name: active_attack_nodegoat
    environment:
      - MONGODB_URI=mongodb://active_attack_nodegoat_db:27017/nodegoat
    depends_on:
      - nodegoat-db
    ports:
      - "4000:4000"
    networks:
      - vulnerable_net
    restart: unless-stopped

# NOTA: se algum build falhar porque o Dockerfile do projeto clonado espera um contexto
# diferente (ex.: precisa do docker-compose.yml PRÓPRIO do projeto, que já define serviços
# auxiliares), o caminho mais simples é usar o docker-compose.yml de dentro de
# _vendor/<projeto>/ para aquele serviço específico e só então conectar manualmente seu
# container à rede "vulnerable_net" (docker network connect) — documentar essa decisão em
# Ameaças à Validade, se necessário.
